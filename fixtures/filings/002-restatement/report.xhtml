<p>废弃物总量（重述）：<ix:nonFraction name="esg:Waste" contextRef="c2" unitRef="u-tonne" decimals="0">135</ix:nonFraction> 吨</p>
<p>员工人数（重述）：<ix:nonFraction name="esg:Workers" contextRef="c1" unitRef="u-count" decimals="0">36</ix:nonFraction> 人</p>
<p>范围一排放：<ix:nonFraction name="esg:Emissions" contextRef="c3" unitRef="u-tco2e" decimals="0" format="ixt:numdotdecimal">4,500</ix:nonFraction> tCO2e</p>
<p>外购电力：<ix:nonFraction name="esg:Energy" contextRef="c2" unitRef="u-mwh" decimals="0" format="ixt:numdotdecimal">2,500</ix:nonFraction> MWh</p>
<p>安全政策：<ix:nonNumeric name="esg:SafetyPolicy" contextRef="c1">合成安全政策：所有数据均为虚构。（重述版补充说明）</ix:nonNumeric></p>
